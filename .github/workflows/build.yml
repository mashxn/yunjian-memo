name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/YunJianMemo/YunJianMemo.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/YunJianMemo/YunJianMemo.csproj
          -c Release -r win-x64 --self-contained false
          -o artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunJianMemo-win-x64
          path: artifact/
